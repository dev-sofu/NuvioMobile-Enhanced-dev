name: Build Test IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Production-optimized or fast validation build
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Release

permissions:
  contents: read

concurrency:
  group: ios-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned full ${{ inputs.configuration }} IPA
    runs-on: macos-26
    timeout-minutes: ${{ inputs.configuration == 'Release' && 75 || 30 }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: ${{ inputs.configuration }}
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        run: |
          if [[ -n "${RELEASE_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
            sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            # The Gradle runtime-config task declares this file as an input,
            # even when no optional local configuration is supplied.
            : > local.properties
          fi

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned full ${{ inputs.configuration }} IPA
        run: |
          (
            while sleep 60; do
              echo "::group::Build resources $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              uptime
              vm_stat
              ps -Ao pid,etime,%cpu,rss,command -r | head -n 12 || true
              echo "::endgroup::"
            done
          ) &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || true' EXIT
          ./scripts/build-ios-ipa.sh

      - name: Verify embedded iOS Local Network permissions
        run: |
          configuration_slug="$(printf '%s' "${IOS_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')"
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name "*-full-${configuration_slug}.ipa" -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "No IPA found for permission verification." >&2
            exit 1
          fi

          python3 - "${ipa_path}" <<'PY'
          import plistlib
          import sys
          import zipfile

          ipa_path = sys.argv[1]
          with zipfile.ZipFile(ipa_path) as archive:
              plist_paths = [
                  name for name in archive.namelist()
                  if name.startswith("Payload/") and name.endswith(".app/Info.plist")
              ]
              if not plist_paths:
                  raise SystemExit("ERROR: No app Info.plist found inside the IPA.")
              with archive.open(plist_paths[0]) as stream:
                  info = plistlib.load(stream)

          usage = info.get("NSLocalNetworkUsageDescription")
          services = info.get("NSBonjourServices", [])
          required_services = {"_googlecast._tcp", "_googlecast-._tcp"}
          missing_services = sorted(required_services - set(services))

          print(f"App Info.plist: {plist_paths[0]}")
          print(f"Bundle identifier: {info.get('CFBundleIdentifier', '(missing)')}")
          print(f"NSLocalNetworkUsageDescription: {'PRESENT' if usage else 'MISSING'}")
          print(f"NSBonjourServices: {services if services else 'MISSING'}")

          summary = [
              "## Embedded Local Network permission check",
              "",
              f"- App Info.plist: `{plist_paths[0]}`",
              f"- Bundle identifier: `{info.get('CFBundleIdentifier', '(missing)')}`",
              f"- NSLocalNetworkUsageDescription: {'PASS' if usage else 'FAIL — missing or empty'}",
              f"- NSBonjourServices: {', '.join(services) if services else 'MISSING'}",
          ]
          if missing_services:
              summary.append(f"- Expected Cast service entries missing: {', '.join(missing_services)}")
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write("\\n".join(summary) + "\\n")

          if not usage:
              print("::warning::The built IPA is missing NSLocalNetworkUsageDescription.")
          if missing_services:
              print("::warning::The built IPA is missing one or more expected Cast Bonjour service entries.")
          PY

      - name: Summarize IPA
        run: |
          configuration_slug="$(printf '%s' "${IOS_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')"
          ipa_path="$(find build/ios-ipa -maxdepth 1 -type f -name "*-full-${configuration_slug}.ipa" -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "No IPA was produced." >&2
            exit 1
          fi

          {
            echo "## Test IPA"
            echo
            echo "- File: $(basename "${ipa_path}")"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${ipa_path}" | awk '{print $1}')"
            echo "- Distribution: full"
            echo "- Configuration: ${IOS_CONFIGURATION}"
            echo "- Signing: unsigned"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test IPA
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-test-${{ inputs.configuration }}-ipa-${{ github.sha }}
          path: build/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
